[package]
name = "gz-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Interoperable Gazebo transport with explicit IO ownership"

[dependencies]
zmq = "=0.10.0"
socket2 = { version = "=0.6.5", features = ["all"] }
uuid = { version = "=1.23.1", features = ["v4"] }
gz-msgs = { version = "=0.1.0", git = "https://github.com/gazebosim-rs/gz-msgs-rs", rev = "e2001a3bc5b54cb15ea1cc16deaefdf14719b2df" }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["hostname", "user", "net"] }

[lints.rust]
unsafe_code = "forbid"
