[package]
name = "gz-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Interoperable Gazebo transport with explicit IO ownership"

[workspace]
members = ["nss"]
resolver = "3"

[dependencies]
zmq = "=0.10.0"
socket2 = { version = "=0.6.5", features = ["all"] }
uuid = { version = "=1.23.1", features = ["v4"] }
gz-msgs = { version = "=0.1.0", git = "https://github.com/gazebosim-rs/gz-msgs-rs", rev = "2cea810e929adb4f925750b325265a99f9ae78b4" }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["hostname", "user", "net", "time"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
gz-transport-nss = { path = "nss", version = "=0.1.0" }

[target.'cfg(unix)'.dev-dependencies]
signal-hook = { version = "=0.4.5", default-features = false }

[lints.rust]
unsafe_code = "forbid"
